<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 · 这一页走丢了</title>
    <style>
        :root { --font-color-0: #1f2328; --font-color-2: #6a737d; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f4;
            color: var(--font-color-0);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", serif;
            padding: 24px;
        }
        .paper {
            background: #fff;
            width: 100%;
            max-width: 640px;
            padding: 48px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            text-align: center;
        }
        .code { margin: 0; font-size: 72px; font-weight: 700; letter-spacing: 8px; }
        h1 { margin: 8px 0 16px; font-size: 20px; font-weight: 600; }
        .desc { margin: 0 0 28px; color: var(--font-color-2); font-size: 14px; line-height: 1.9; }
        a { color: var(--font-color-0); font-size: 14px; text-decoration: none; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
        a:hover { border-bottom-color: var(--font-color-0); }
    </style>
</head>
<body>
    <div class="paper">
        <p class="code">404</p>
        <h1>这一页走丢了</h1>
        <p class="desc">你要找的页面不在这里，可能是链接写错了，也可能它已经被我删掉了。</p>
        <a href="/">← 回到首页</a>
    </div>
</body>
</html>
